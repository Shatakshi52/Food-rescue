<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Surplus Food - Food Rescue</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🥘 Food Rescue Board</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="available.html" class="active">Browse Food</a>
            <a href="donate.html">Post Surplus</a>
            <a href="claims.html">My Claims</a>
        </div>
    </nav>

    <main class="board-container">
        <h2>🍱 Live Neighborhood Food Board</h2>
        
        <div class="filter-bar">
            <button class="filter-btn active" data-tag="ALL">All</button>
            <button class="filter-btn" data-tag="Vegetarian">🌱 Vegetarian</button>
            <button class="filter-btn" data-tag="Vegan">🥗 Vegan</button>
            <button class="filter-btn" data-tag="Non-Vegetarian">🍖 Non-Veg</button>
        </div>

        <div id="foodGrid" class="cards-grid">
            <!-- Dynamic Food Cards Will Be Injected Here -->
        </div>
    </main>

    <!-- Claim Modal -->
    <div id="claimModal" class="modal hidden">
        <div class="modal-content">
            <h3>Claim Surplus Food</h3>
            <form id="claimForm">
                <input type="hidden" id="modalFoodId">
                <label>Your Name / Organization</label>
                <input type="text" id="volunteer_name" required>
                <label>Phone Number</label>
                <input type="tel" id="volunteer_phone" required>
                <label>Quantity to Claim</label>
                <input type="number" id="claimed_quantity" min="1" required>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Confirm Claim</button>
                    <button type="button" class="btn btn-secondary" onclick="closeClaimModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/expiry_timer.js"></script>
    <script src="js/claim_handler.js"></script>
    <script src="js/filter.js"></script>
</body>
</html>
