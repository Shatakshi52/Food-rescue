<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Rescue - Surplus Food Expiry Board</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🥘 Food Rescue Board</div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="available.html">Browse Food</a>
            <a href="donate.html">Post Surplus</a>
            <a href="claims.html">My Claims</a>
        </div>
    </nav>

    <header class="hero">
        <h1>Turn Surplus Food Into Community Impact</h1>
        <p>Connecting local eateries with community volunteers in real-time before safe consumption time expires.</p>
        <div class="cta-buttons">
            <a href="available.html" class="btn btn-primary">Find Available Food</a>
            <a href="donate.html" class="btn btn-secondary">Donate Surplus Food</a>
        </div>
    </header>

    <section class="stats-container">
        <div class="stat-card">
            <h2 id="stat-total-saved">0</h2>
            <p>Meals Rescued</p>
        </div>
        <div class="stat-card">
            <h2 id="stat-active">0</h2>
            <p>Active Listings</p>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const items = await API.getFood();
                const rescued = items.reduce((n, i) => n + (i.total_quantity - i.remaining_quantity), 0);
                const active = items.filter(i => i.status === 'AVAILABLE').length;
                document.getElementById('stat-total-saved').textContent = rescued;
                document.getElementById('stat-active').textContent = active;
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
