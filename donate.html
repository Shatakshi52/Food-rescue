<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Surplus Food - Food Rescue</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">🥘 Food Rescue Board</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="available.html">Browse Food</a>
            <a href="donate.html" class="active">Post Surplus</a>
            <a href="claims.html">My Claims</a>
        </div>
    </nav>

    <main class="form-container">
        <h2>🏪 Register Surplus Food</h2>
        <form id="donateForm">
            <label>Restaurant/Eatery Name</label>
            <input type="text" id="restaurant_name" required placeholder="e.g. Green Leaf Cafe">

            <label>Food Item Description</label>
            <input type="text" id="food_name" required placeholder="e.g. 20 Pack Veg Biryani">

            <label>Quantity (Meals/Items)</label>
            <input type="number" id="quantity" min="1" required placeholder="e.g. 15">

            <label>Dietary Tag</label>
            <select id="dietary_tag">
                <option value="Vegetarian">🌱 Vegetarian</option>
                <option value="Vegan">🥗 Vegan</option>
                <option value="Non-Vegetarian">🍖 Non-Vegetarian</option>
                <option value="Contains Dairy">🧀 Contains Dairy</option>
            </select>

            <label>Safe Consumption Expiry Time</label>
            <input type="datetime-local" id="expiry_at" required>

            <label>Pickup Address</label>
            <input type="text" id="pickup_address" required placeholder="Street address and landmark">

            <label>Contact Phone</label>
            <input type="tel" id="contact_phone" required placeholder="10-digit phone number">

            <button type="submit" class="btn btn-primary">Post Surplus Listing</button>
        </form>
    </main>

    <script src="js/api.js"></script>
    <script src="js/donate_form.js"></script>
</body>
</html>
